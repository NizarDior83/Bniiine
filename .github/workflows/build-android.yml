name: Build Android APK

# Trigger:
#   - manually from the Actions tab ("Run workflow" button)
#   - automatically on any push to main that touches the android/ folder
#     or the shared web files that get bundled into the APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'index.html'
      - 'styles.css'
      - 'game.js'
      - 'manifest.webmanifest'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android/package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest runners already have the Android SDK preinstalled at
      # /usr/local/lib/android/sdk with recent build-tools + platform 34.
      # This action wires up ANDROID_HOME and makes sdkmanager reachable.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor dependencies
        working-directory: android
        run: npm install --no-audit --no-fund

      - name: Add Android platform (generates the Gradle project)
        working-directory: android
        run: npx cap add android

      - name: Sync web assets into the Android project
        working-directory: android
        run: npx cap sync android

      - name: Apply portrait / haptics / large-heap manifest patches
        working-directory: android
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Add the two extra permissions if they're not already present
          grep -q 'android.permission.VIBRATE' "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' "$MANIFEST"
          # Force portrait, enable largeHeap + hardware acceleration
          sed -i 's#android:hardwareAccelerated="[^"]*"##g' "$MANIFEST"
          sed -i 's#<application#<application android:hardwareAccelerated="true" android:largeHeap="true"#' "$MANIFEST"
          sed -i 's#<activity #<activity android:screenOrientation="portrait" #' "$MANIFEST"
          cat "$MANIFEST"

      - name: Build debug APK with Gradle
        working-directory: android/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Locate produced APK
        id: find_apk
        run: |
          APK=$(find android/android/app/build/outputs/apk/debug -name 'app-debug.apk' -print -quit)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bniine-debug-apk
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
